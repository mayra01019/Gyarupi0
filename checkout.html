<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkout</title>
<link rel="stylesheet" href="/index.css">

</head>

<body>
    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header class="cabecalho">

        <div class="logo">

            <a href="index.html">
                GYARUPI
            </a>

        </div>


        <nav class="menu">

            <a href="index.html">HOME</a>

            <a href="colecao.html">COLEÇÃO</a>

            <a href="lookbook.html">LOOKBOOK</a>

            <a href="sobre.html">SOBRE</a>

        </nav>

    </header>



    <!-- =========================
         CHECKOUT
    ========================== -->

    <main class="checkout">


        <div class="checkout-titulo">

            <p class="subtitulo">
                ALMOST YOURS ♡
            </p>

            <h1>CHECKOUT</h1>

            <p>
                Só falta um pouquinho para finalizar seu pedido.
            </p>

        </div>



        <!-- =========================
             CONTEÚDO
        ========================== -->

        <div class="checkout-grid">


            <!-- LADO ESQUERDO -->

            <div class="checkout-formulario">


                <!-- DADOS -->

                <section class="checkout-bloco">

                    <span class="checkout-numero">
                        01
                    </span>

                    <h2>SEUS DADOS</h2>


                    <label for="nome">
                        NOME
                    </label>

                    <input type="text" id="nome" placeholder="Seu nome">


                    <label for="email">
                        E-MAIL
                    </label>

                    <input type="email" id="email" placeholder="seuemail@email.com">


                    <label for="telefone">
                        TELEFONE
                    </label>

                    <input type="tel" id="telefone" placeholder="(00) 00000-0000">

                </section>



                <!-- ENTREGA -->

                <section class="checkout-bloco">

                    <span class="checkout-numero">
                        02
                    </span>

                    <h2>ENTREGA</h2>


                    <label for="cep">
                        CEP
                    </label>

                    <input type="text" id="cep" placeholder="00000-000">


                    <label for="endereco">
                        ENDEREÇO
                    </label>

                    <input type="text" id="endereco" placeholder="Rua, avenida...">


                    <div class="checkout-linha">

                        <div>

                            <label for="numero">
                                NÚMERO
                            </label>

                            <input type="text" id="numero" placeholder="123">

                        </div>


                        <div>

                            <label for="cidade">
                                CIDADE
                            </label>

                            <input type="text" id="cidade" placeholder="Sua cidade">

                        </div>

                    </div>

                </section>



                <!-- PAGAMENTO -->

                <section class="checkout-bloco">

                    <span class="checkout-numero">
                        03
                    </span>

                    <h2>PAGAMENTO</h2>


                    <div class="formas-pagamento">

                        <label>

                            <input type="radio" name="pagamento" value="pix">

                            PIX

                        </label>


                        <label>

                            <input type="radio" name="pagamento" value="cartao">

                            CARTÃO

                        </label>


                        <label>

                            <input type="radio" name="pagamento" value="boleto">

                            BOLETO

                        </label>

                    </div>

                </section>


            </div>



            <!-- LADO DIREITO -->

            <aside class="resumo-pedido">

                <p class="resumo-mini">
                    YOUR GYARUPI ♡
                </p>

                <h2>SEU PEDIDO</h2>


                <div id="checkout-produtos">

                    <p>
                        Seus produtos aparecerão aqui.
                    </p>

                </div>


                <div class="checkout-total">

                    <span>TOTAL</span>

                    <strong id="checkout-total">
                        R$ 0,00
                    </strong>

                </div>


                <button type="button" class="botao-finalizar-pedido">

                    FINALIZAR PEDIDO ♡

                </button>


                <p class="checkout-aviso">
                    ✦ Projeto demonstrativo. Nenhum pagamento real será processado.
                </p>

            </aside>


        </div>

    </main>


</body>

</html>

















</body>

</html>
